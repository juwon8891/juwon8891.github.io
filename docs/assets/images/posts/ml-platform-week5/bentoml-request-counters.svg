<svg xmlns="http://www.w3.org/2000/svg" width="960" height="316" viewBox="0 0 960 316" role="img" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title>BentoML 로컬 실습 요청 카운터</title><desc>정상 요청 한 건을 더 보내자 HTTP 200 카운터만 1에서 2로 증가했다. 400은 1, 500은 0으로 유지됐다.</desc><rect width="960" height="316" rx="20" fill="#f1f5fb"/>
<text x="32" y="46" fill="#14243d" font-size="29" font-weight="700">추론 요청 한 건이 메트릭에 남는 과정</text>
<text x="32" y="76" fill="#40536e" font-size="17" font-weight="500">BentoML 로컬 실습 · /predict 누적 요청 수</text>
