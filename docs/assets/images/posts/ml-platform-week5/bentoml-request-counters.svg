<rect x="571" y="132" width="220" height="30" rx="6" fill="#dbe6f2"/>
<rect x="571" y="132" width="188" height="30" rx="6" fill="#175ea9"/>
<text x="802" y="155" fill="#14243d" font-size="19" font-weight="700">2</text>
<text x="34" y="206" fill="#14243d" font-size="18" font-weight="700">HTTP 400</text>
