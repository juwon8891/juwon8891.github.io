<text x="571" y="113" fill="#40536e" font-size="17" font-weight="700">정상 요청 1건 추가 후</text>
<text x="34" y="154" fill="#14243d" font-size="18" font-weight="700">HTTP 200</text>
<rect x="232" y="132" width="220" height="30" rx="6" fill="#dbe6f2"/>
<rect x="232" y="132" width="94" height="30" rx="6" fill="#58799e"/>
