<svg xmlns="http://www.w3.org/2000/svg" width="960" height="334" viewBox="0 0 960 334" role="img" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title>추천 모델 승격</title><desc>평가 조건을 고정한 다음, 현재 모델과 후보의 품질 차이를 본다.</desc><rect width="960" height="334" rx="20" fill="#f1f5fb"/>
