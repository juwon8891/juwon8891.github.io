<svg xmlns="http://www.w3.org/2000/svg" width="960" height="439" viewBox="0 0 960 439" role="img" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title>추론 장애를 나눠 보는 세 가지 신호</title><desc>서비스 상태, 입력 상태, 예측 품질을 각각 확인한다.</desc><rect width="960" height="439" rx="20" fill="#f1f5fb"/>
