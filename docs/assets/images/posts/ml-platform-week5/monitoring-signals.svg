<text x="624" y="255" fill="#315f92" font-size="20" font-weight="700">→</text>
<rect x="644" y="209" width="282" height="76" rx="12" fill="#ffffff" stroke="#a7bdd7"/>
<text x="659" y="239" fill="#103b70" font-size="21" font-weight="700">확인</text>
<text x="659" y="264" fill="#14243d" font-size="16" font-weight="500">입력 검증과 집단별 표본</text>
