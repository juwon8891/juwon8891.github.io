<text x="353" y="134" fill="#103b70" font-size="21" font-weight="700">원인 후보</text>
<text x="353" y="159" fill="#14243d" font-size="16" font-weight="500">큐 대기 · 모델 로딩 · 포화</text>
<text x="624" y="150" fill="#315f92" font-size="20" font-weight="700">→</text>
<rect x="644" y="104" width="282" height="76" rx="12" fill="#ffffff" stroke="#a7bdd7"/>
<text x="659" y="134" fill="#103b70" font-size="21" font-weight="700">확인</text>
<text x="659" y="159" fill="#14243d" font-size="16" font-weight="500">버전별 지표와 Pod 로그</text>
<rect x="32" y="209" width="282" height="76" rx="12" fill="#ffffff" stroke="#a7bdd7"/>
<text x="47" y="239" fill="#103b70" font-size="21" font-weight="700">입력 상태</text>
<text x="47" y="264" fill="#14243d" font-size="16" font-weight="500">결측 · 범위 · 분포 변화</text>
<text x="318" y="255" fill="#315f92" font-size="20" font-weight="700">→</text>
<rect x="338" y="209" width="282" height="76" rx="12" fill="#ffffff" stroke="#a7bdd7"/>
<text x="353" y="239" fill="#103b70" font-size="21" font-weight="700">원인 후보</text>
