<svg xmlns="http://www.w3.org/2000/svg" width="960" height="439" viewBox="0 0 960 439" role="img" font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif"><title>강의에서 비교한 모델 서빙 경로</title><desc>모델 파일이 같아도 입력 계약과 배포 경계가 달라진다.</desc><rect width="960" height="439" rx="20" fill="#f1f5fb"/>
