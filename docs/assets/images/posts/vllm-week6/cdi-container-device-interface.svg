<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-label="Device Plugin의 Allocate 응답이 CDI 정규화 이름을 반환하면 컨테이너 런타임이 /etc/cdi 스펙 파일을 조회해 env, deviceNodes, mounts, hooks를 OCI 런타임 스펙에 병합하는 흐름">
  <defs>
    <marker id="a10" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Row1: 4-step flow -->
  <rect x="20" y="30" width="210" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="125" y="56" text-anchor="middle" font-family="Noto Sans KR" font-size="12.5" fill="#1e2233" font-weight="600">Device Plugin</text>
  <text x="125" y="73" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#4338ca">Allocate() 응답</text>
  <text x="125" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#4338ca">CDIDevices: [nvidia.com/gpu=0]</text>

  <line x1="230" y1="65" x2="260" y2="65" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a10)"/>

  <rect x="260" y="30" width="210" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="365" y="58" text-anchor="middle" font-family="Noto Sans KR" font-size="12.5" fill="#1e2233" font-weight="600">Container Runtime</text>
  <text x="365" y="76" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">(containerd/CRI-O)이</text>
  <text x="365" y="90" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">이름으로 스펙 파일 조회</text>

  <line x1="470" y1="65" x2="500" y2="65" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a10)"/>

  <rect x="500" y="30" width="210" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="605" y="56" text-anchor="middle" font-family="Noto Sans KR" font-size="12.5" fill="#1e2233" font-weight="700">CDI 스펙 파일</text>
  <text x="605" y="74" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#4338ca">/etc/cdi/nvidia.json</text>
  <text x="605" y="88" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">devices + containerEdits</text>

  <line x1="710" y1="65" x2="740" y2="65" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a10)"/>

  <rect x="740" y="30" width="220" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="850" y="58" text-anchor="middle" font-family="Noto Sans KR" font-size="12.5" fill="#1e2233" font-weight="600">OCI Runtime Spec</text>
  <text x="850" y="76" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">병합 후</text>
  <text x="850" y="90" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#6b7280">runc가 그대로 실행</text>

  <!-- connector down from spec file to containerEdits detail -->
  <line x1="605" y1="100" x2="605" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="350" y1="130" x2="860" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="350" y1="130" x2="350" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a10)"/>
  <line x1="520" y1="130" x2="520" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a10)"/>
  <line x1="690" y1="130" x2="690" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a10)"/>
  <line x1="860" y1="130" x2="860" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a10)"/>
  <text x="605" y="122" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">containerEdits 4개 필드</text>

  <g font-family="Noto Sans KR">
    <rect x="275" y="158" width="150" height="76" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.4"/>
    <text x="350" y="180" text-anchor="middle" font-size="11.5" fill="#1e2233" font-weight="600">env</text>
    <text x="350" y="198" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#6b7280">NVIDIA_VISIBLE</text>
    <text x="350" y="211" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#6b7280">_DEVICES=0</text>
    <text x="350" y="226" text-anchor="middle" font-size="9.5" fill="#6b7280">환경 변수 주입</text>

    <rect x="445" y="158" width="150" height="76" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.4"/>
    <text x="520" y="180" text-anchor="middle" font-size="11.5" fill="#1e2233" font-weight="600">deviceNodes</text>
    <text x="520" y="198" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#6b7280">/dev/nvidia0</text>
    <text x="520" y="215" text-anchor="middle" font-size="9.5" fill="#6b7280">디바이스 노드</text>
    <text x="520" y="228" text-anchor="middle" font-size="9.5" fill="#6b7280">마운트</text>

    <rect x="615" y="158" width="150" height="76" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.4"/>
    <text x="690" y="180" text-anchor="middle" font-size="11.5" fill="#1e2233" font-weight="600">mounts</text>
    <text x="690" y="198" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#6b7280">libcuda.so 등</text>
    <text x="690" y="215" text-anchor="middle" font-size="9.5" fill="#6b7280">호스트 드라이버</text>
    <text x="690" y="228" text-anchor="middle" font-size="9.5" fill="#6b7280">라이브러리</text>

    <rect x="785" y="158" width="150" height="76" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.4"/>
    <text x="860" y="180" text-anchor="middle" font-size="11.5" fill="#1e2233" font-weight="600">hooks</text>
    <text x="860" y="198" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#6b7280">createRuntime</text>
    <text x="860" y="215" text-anchor="middle" font-size="9.5" fill="#6b7280">단계별 실행할</text>
    <text x="860" y="228" text-anchor="middle" font-size="9.5" fill="#6b7280">스크립트</text>
  </g>

  <rect x="60" y="270" width="860" height="100" rx="8" fill="#fdf3e7" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="490" y="296" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#7c4a03" font-weight="600">CDI 이전: 벤더마다 OCI prestart 훅을 직접 구현 (예: nvidia-container-runtime-hook)</text>
  <text x="490" y="316" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#7c4a03">→ 런타임마다, 벤더마다 훅 로직이 제각각</text>
  <text x="490" y="342" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#7c4a03" font-weight="600">CDI 이후: 벤더는 스펙 파일만 작성, 런타임의 공통 CDI 처리 로직이 나머지를 수행</text>
  <text x="490" y="362" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#7c4a03">→ Docker·containerd·CRI-O·Podman이 동일한 방식으로 지원</text>
</svg>
