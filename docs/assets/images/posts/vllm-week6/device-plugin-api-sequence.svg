<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-label="kubelet과 Device Plugin이 유닉스 소켓 기반 gRPC로 Register, ListAndWatch, Allocate 세 단계를 주고받는 시퀀스 다이어그램">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="60" y="20" width="180" height="40" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="150" y="45" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#1e2233" font-weight="700">kubelet</text>
  <line x1="150" y1="60" x2="150" y2="330" stroke="#d6d9e6" stroke-width="1.5"/>

  <rect x="660" y="20" width="200" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="760" y="45" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#1e2233" font-weight="700">Device Plugin</text>
  <line x1="760" y1="60" x2="760" y2="330" stroke="#d6d9e6" stroke-width="1.5"/>

  <text x="500" y="90" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#9ca3af">/var/lib/kubelet/device-plugins/kubelet.sock</text>

  <line x1="760" y1="110" x2="160" y2="110" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="460" y="103" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#4b5563">1. Register(name, endpoint)</text>

  <line x1="160" y1="155" x2="750" y2="155" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="460" y="148" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#4b5563">2. ListAndWatch() 스트림 오픈</text>

  <line x1="750" y1="188" x2="170" y2="188" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="460" y="181" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#4b5563">3. Device 목록 + Health 스트리밍</text>

  <rect x="200" y="200" width="420" height="30" rx="6" fill="#f8f8fc" stroke="#e3e4ee" stroke-width="1"/>
  <text x="410" y="220" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#6b7280">kubelet이 Node.status.allocatable 갱신 (예: 4개)</text>

  <line x1="160" y1="260" x2="750" y2="260" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="460" y="253" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#4b5563">4. Pod 배치 후 Allocate([deviceIDs])</text>

  <line x1="750" y1="303" x2="170" y2="303" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="460" y="296" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#4b5563">5. 장치 경로 · env · mount 응답</text>

  <text x="150" y="352" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#6b7280">→ 컨테이너 런타임에 전달</text>
</svg>
