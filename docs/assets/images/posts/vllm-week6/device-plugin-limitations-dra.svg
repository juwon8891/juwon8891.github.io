<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="Device Plugin은 정적 리소스 개수만 표현할 수 있는 반면 DRA는 DeviceClass, ResourceClaim, ResourceSlice를 통해 조건 기반으로 디바이스를 매칭한다는 비교">
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a7s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <text x="235" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#b45309" font-weight="700">BEFORE — Device Plugin (레거시)</text>
  <text x="705" y="28" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#4338ca" font-weight="700">AFTER — DRA (차세대)</text>
  <line x1="470" y1="20" x2="470" y2="380" stroke="#e3e4ee" stroke-width="1.5"/>

  <!-- LEFT: device plugin limitation -->
  <rect x="40" y="50" width="200" height="66" rx="8" fill="#fdf3e7" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="140" y="76" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#7c4a03" font-weight="600">Pod spec</text>
  <text x="140" y="94" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#7c4a03">nvidia.com/gpu: 1</text>
  <text x="140" y="108" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#7c4a03">"몇 개"만 표현 가능</text>

  <line x1="140" y1="116" x2="140" y2="150" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a7)"/>
  <rect x="40" y="158" width="200" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.4"/>
  <text x="140" y="180" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#1e2233" font-weight="500">스케줄러</text>
  <text x="140" y="198" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">숫자만 보고 필터링</text>
  <text x="140" y="212" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">"어떤 GPU"는 알 수 없음</text>

  <rect x="40" y="248" width="200" height="110" rx="8" fill="#f8f8fc" stroke="#e3e4ee" stroke-width="1"/>
  <text x="140" y="270" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#1e2233" font-weight="600">표현 불가능한 요구</text>
  <text x="140" y="290" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">· 메모리 40GB 이상만</text>
  <text x="140" y="306" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">· 같은 NVLink 도메인 내 2장</text>
  <text x="140" y="322" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">· 여러 Pod가 한 장을 정책적으로 공유</text>
  <text x="140" y="340" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">→ 벤더별 애너테이션·웹훅으로 우회</text>

  <!-- RIGHT: DRA flow -->
  <rect x="510" y="50" width="200" height="66" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="610" y="76" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">ResourceClaim</text>
  <text x="610" y="94" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">"메모리≥40GB 1장" 같은</text>
  <text x="610" y="108" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">조건을 선언</text>

  <line x1="610" y1="116" x2="610" y2="150" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#a7s)"/>
  <rect x="510" y="158" width="200" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="610" y="182" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#1e2233" font-weight="600">DeviceClass</text>
  <text x="610" y="200" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">어떤 드라이버·셀렉터 쓸지 정의</text>

  <line x1="610" y1="218" x2="610" y2="252" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#a7s)"/>
  <rect x="510" y="260" width="200" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text x="610" y="284" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#1e2233" font-weight="600">ResourceSlice</text>
  <text x="610" y="302" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">드라이버가 광고한 실제 디바이스 목록</text>

  <line x1="710" y1="290" x2="770" y2="290" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#a7s)"/>
  <rect x="778" y="255" width="140" height="70" rx="8" fill="#f3f4f9" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="848" y="280" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#1e2233" font-weight="600">스케줄러가</text>
  <text x="848" y="296" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">조건 매칭 후</text>
  <text x="848" y="311" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">디바이스 확정</text>

  <text x="610" y="345" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">→ 결과가 ResourceClaim.status에 기록, kubelet이 드라이버에 준비 요청</text>
  <text x="610" y="365" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#9ca3af">모두 resource.k8s.io/v1 그룹의 CRD</text>
</svg>
