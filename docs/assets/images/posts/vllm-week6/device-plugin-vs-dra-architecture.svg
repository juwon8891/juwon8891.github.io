<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-label="쿠버네티스가 노드 로컬 Device Plugin 경로와 클러스터 레벨 DRA 경로 두 가지로 가속기 벤더 드라이버와 연결되고 두 경로 모두 같은 벤더 드라이버로 수렴하는 구조">
  <defs>
    <marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="340" y="20" width="260" height="56" rx="10" fill="#f3f4f9" stroke="#9aa0b8" stroke-width="1.8"/>
  <text x="470" y="53" text-anchor="middle" font-family="Noto Sans KR" font-size="14" fill="#1e2233" font-weight="700">Kubernetes Control Plane</text>

  <line x1="400" y1="76" x2="240" y2="120" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a9)"/>
  <line x1="540" y1="76" x2="700" y2="120" stroke="#4f46e5" stroke-width="1.7" marker-end="url(#a9)"/>

  <!-- left path: device plugin -->
  <rect x="90" y="128" width="300" height="60" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="240" y="152" text-anchor="middle" font-family="Noto Sans KR" font-size="12.5" fill="#1e2233" font-weight="600">Device Plugin 경로 (레거시)</text>
  <text x="240" y="170" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">노드 로컬 gRPC · 정적 리소스 이름 · 단순</text>

  <line x1="240" y1="188" x2="240" y2="222" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a9)"/>

  <!-- right path: DRA -->
  <rect x="550" y="128" width="300" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.7"/>
  <text x="700" y="152" text-anchor="middle" font-family="Noto Sans KR" font-size="12.5" fill="#1e2233" font-weight="700">DRA 경로 (차세대, GA v1.34)</text>
  <text x="700" y="170" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#4338ca">클러스터 API · 조건 기반 클레임 · 세밀함</text>

  <line x1="700" y1="188" x2="700" y2="222" stroke="#4f46e5" stroke-width="1.7" marker-end="url(#a9)"/>

  <rect x="120" y="230" width="240" height="46" rx="8" fill="#f8f8fc" stroke="#e3e4ee" stroke-width="1"/>
  <text x="240" y="257" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">Fig.01·02 — 여전히 대다수 클러스터의 기본값</text>

  <rect x="580" y="230" width="240" height="46" rx="8" fill="#f8f8fc" stroke="#e3e4ee" stroke-width="1"/>
  <text x="700" y="257" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#4338ca">Fig.07·08 — 세밀한 조건이 필요할 때 채택 증가</text>

  <line x1="240" y1="276" x2="240" y2="305" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="700" y1="276" x2="700" y2="305" stroke="#4f46e5" stroke-width="1.7"/>
  <line x1="240" y1="305" x2="700" y2="305" stroke="#c9cee0" stroke-width="1.3" stroke-dasharray="4 3"/>
  <line x1="470" y1="305" x2="470" y2="330" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a9)"/>

  <text x="470" y="322" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#9ca3af">두 경로 모두 결국 같은 벤더 드라이버로 수렴</text>

  <rect x="60" y="340" width="820" height="60" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="470" y="365" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">NVIDIA · AMD · Intel · AWS Neuron · Google TPU 드라이버 (Fig.06)</text>
  <text x="470" y="384" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">주요 벤더는 기존 Device Plugin을 유지하며 DRA 드라이버를 병행 개발 중</text>
</svg>
