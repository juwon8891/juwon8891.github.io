<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="340" viewBox="0 0 980 340" role="img" aria-label="DRA가 1.26 알파의 Classic DRA에서 시작해 1.32에서 구조화 파라미터 모델만 남기고 1.34에서 GA, 1.37 확장 리소스 GA까지 진화한 타임라인">
  <line x1="40" y1="170" x2="940" y2="170" stroke="#c9cee0" stroke-width="2"/>

  <!-- nodes: alternate up/down -->
  <!-- 1.26 -->
  <circle cx="80" cy="170" r="6" fill="#9aa0b8"/>
  <line x1="80" y1="164" x2="80" y2="120" stroke="#c9cee0" stroke-width="1.3"/>
  <rect x="10" y="60" width="140" height="60" rx="7" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.3"/>
  <text x="80" y="80" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3b3f52" font-weight="700">v1.26</text>
  <text x="80" y="96" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">Alpha 도입</text>
  <text x="80" y="110" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">"Classic DRA"</text>

  <!-- 1.31 -->
  <circle cx="260" cy="170" r="6" fill="#9aa0b8"/>
  <line x1="260" y1="176" x2="260" y2="222" stroke="#c9cee0" stroke-width="1.3"/>
  <rect x="190" y="222" width="140" height="60" rx="7" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.3"/>
  <text x="260" y="242" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3b3f52" font-weight="700">v1.31</text>
  <text x="260" y="258" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">Classic DRA 별도</text>
  <text x="260" y="272" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">feature gate로 분리</text>

  <!-- 1.32 -->
  <circle cx="380" cy="170" r="7" fill="#b45309"/>
  <line x1="380" y1="164" x2="380" y2="120" stroke="#c9cee0" stroke-width="1.3"/>
  <rect x="310" y="55" width="140" height="65" rx="7" fill="#fdf3e7" stroke="#b45309" stroke-width="1.4"/>
  <text x="380" y="75" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c4a03" font-weight="700">v1.32</text>
  <text x="380" y="91" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#7c4a03">Classic DRA 제거</text>
  <text x="380" y="105" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#7c4a03">구조화 파라미터만 (alpha)</text>

  <!-- 1.33 -->
  <circle cx="500" cy="170" r="6" fill="#9aa0b8"/>
  <line x1="500" y1="176" x2="500" y2="222" stroke="#c9cee0" stroke-width="1.3"/>
  <rect x="430" y="222" width="140" height="65" rx="7" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.3"/>
  <text x="500" y="242" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3b3f52" font-weight="700">v1.33</text>
  <text x="500" y="258" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">Beta 승격 +</text>
  <text x="500" y="272" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">Partitionable Devices</text>

  <!-- 1.34 GA -->
  <circle cx="620" cy="170" r="8" fill="#4f46e5"/>
  <line x1="620" y1="162" x2="620" y2="120" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="540" y="45" width="160" height="75" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="620" y="66" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#3730a3" font-weight="700">v1.34 — GA</text>
  <text x="620" y="83" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#3730a3">resource.k8s.io/v1 안정화</text>
  <text x="620" y="97" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#3730a3">Consumable Capacity 추가</text>
  <text x="620" y="111" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#3730a3">Admin Access beta</text>

  <!-- 1.35 -->
  <circle cx="740" cy="170" r="6" fill="#4f46e5"/>
  <line x1="740" y1="176" x2="740" y2="222" stroke="#c9cee0" stroke-width="1.3"/>
  <rect x="670" y="222" width="140" height="60" rx="7" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.3"/>
  <text x="740" y="242" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3b3f52" font-weight="700">v1.35</text>
  <text x="740" y="258" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">기본 활성화 고정</text>
  <text x="740" y="272" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">(끌 수 없음)</text>

  <!-- 1.36 -->
  <circle cx="830" cy="170" r="6" fill="#9aa0b8"/>
  <line x1="830" y1="164" x2="830" y2="120" stroke="#c9cee0" stroke-width="1.3"/>
  <rect x="760" y="55" width="140" height="60" rx="7" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.3"/>
  <text x="830" y="75" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#3b3f52" font-weight="700">v1.36</text>
  <text x="830" y="91" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">드라이버 생태계</text>
  <text x="830" y="105" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">확장 ("다음 시대")</text>

  <!-- 1.37 -->
  <circle cx="910" cy="170" r="8" fill="#4f46e5"/>
  <line x1="910" y1="176" x2="910" y2="222" stroke="#4f46e5" stroke-width="1.6"/>
  <rect x="820" y="222" width="150" height="75" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="895" y="243" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" fill="#3730a3" font-weight="700">v1.37</text>
  <text x="895" y="260" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#3730a3">Device Taints GA +</text>
  <text x="895" y="274" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#3730a3">Extended Resource</text>
  <text x="895" y="288" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#3730a3">매핑 GA (점진 이관)</text>

  <text x="500" y="325" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">(2026년 9월 기준, 현재 안정 릴리스는 v1.34 · v1.37은 최신 릴리스)</text>
</svg>
