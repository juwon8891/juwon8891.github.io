<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400" role="img" aria-label="Full GPU, Time-Slicing, MPS, MIG 네 가지 GPU 공유 방식을 격리 수준과 동시 실행 방식 기준으로 비교">
  <!-- headers -->
  <g font-family="Noto Sans KR">
    <rect x="20" y="20" width="215" height="46" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="127" y="48" text-anchor="middle" font-size="13" fill="#1e2233" font-weight="700">Full GPU</text>

    <rect x="250" y="20" width="215" height="46" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="357" y="48" text-anchor="middle" font-size="13" fill="#1e2233" font-weight="700">Time-Slicing</text>

    <rect x="480" y="20" width="215" height="46" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="587" y="48" text-anchor="middle" font-size="13" fill="#1e2233" font-weight="700">MPS</text>

    <rect x="710" y="20" width="215" height="46" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="817" y="48" text-anchor="middle" font-size="13" fill="#1e2233" font-weight="700">MIG</text>
  </g>

  <!-- schematic row: pod boxes over one GPU bar -->
  <g>
    <!-- full gpu: one big block -->
    <rect x="35" y="86" width="185" height="50" rx="6" fill="#dfe1ee" stroke="#9aa0b8" stroke-width="1.2"/>
    <text x="127" y="116" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#3b3f52">Pod 1개가 전체 점유</text>

    <!-- time slicing: same block, striped -->
    <rect x="265" y="86" width="185" height="50" rx="6" fill="#dfe1ee" stroke="#9aa0b8" stroke-width="1.2"/>
    <line x1="311" y1="86" x2="311" y2="136" stroke="#9aa0b8" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="357" y1="86" x2="357" y2="136" stroke="#9aa0b8" stroke-width="1" stroke-dasharray="3 2"/>
    <line x1="403" y1="86" x2="403" y2="136" stroke="#9aa0b8" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="357" y="116" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#3b3f52">Pod 4개, 시간 분할</text>

    <!-- MPS: same block, vertical solid divisions but shared memory space note -->
    <rect x="495" y="86" width="185" height="50" rx="6" fill="#dfe1ee" stroke="#9aa0b8" stroke-width="1.2"/>
    <line x1="541" y1="86" x2="541" y2="136" stroke="#9aa0b8" stroke-width="1"/>
    <line x1="587" y1="86" x2="587" y2="136" stroke="#9aa0b8" stroke-width="1"/>
    <line x1="633" y1="86" x2="633" y2="136" stroke="#9aa0b8" stroke-width="1"/>
    <text x="587" y="116" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#3b3f52">동시 실행, 컨텍스트 공유</text>

    <!-- MIG: hard partitions -->
    <rect x="725" y="86" width="185" height="50" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
    <line x1="771" y1="86" x2="771" y2="136" stroke="#4f46e5" stroke-width="1.4"/>
    <line x1="817" y1="86" x2="817" y2="136" stroke="#4f46e5" stroke-width="1.4"/>
    <line x1="863" y1="86" x2="863" y2="136" stroke="#4f46e5" stroke-width="1.4"/>
    <text x="817" y="116" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#3730a3">하드웨어 파티션 (Fig.05)</text>
  </g>

  <!-- comparison rows -->
  <g font-family="Noto Sans KR" font-size="11.5" fill="#3b3f52">
    <text x="20" y="176" font-weight="700" fill="#6b7280" font-size="11">격리 수준</text>
    <text x="127" y="176" text-anchor="middle">없음 (단독 사용)</text>
    <text x="357" y="176" text-anchor="middle">없음 (SM 순차 점유)</text>
    <text x="587" y="176" text-anchor="middle">낮음 (메모리 공간 공유)</text>
    <text x="817" y="176" text-anchor="middle" font-weight="700" fill="#3730a3">높음 (SM·메모리·캐시 분리)</text>

    <line x1="20" y1="192" x2="925" y2="192" stroke="#e3e4ee" stroke-width="1"/>
    <text x="20" y="214" font-weight="700" fill="#6b7280" font-size="11">동시 실행</text>
    <text x="127" y="214" text-anchor="middle">불가 (1 Pod)</text>
    <text x="357" y="214" text-anchor="middle">가능 (시분할 스케줄)</text>
    <text x="587" y="214" text-anchor="middle">가능 (동시 커널 실행)</text>
    <text x="817" y="214" text-anchor="middle">가능 (독립 인스턴스)</text>

    <line x1="20" y1="230" x2="925" y2="230" stroke="#e3e4ee" stroke-width="1"/>
    <text x="20" y="252" font-weight="700" fill="#6b7280" font-size="11">장애 전파</text>
    <text x="127" y="252" text-anchor="middle">해당 없음</text>
    <text x="357" y="252" text-anchor="middle">한 Pod OOM → 전체 영향</text>
    <text x="587" y="252" text-anchor="middle">한 Pod 크래시 → 전체 영향</text>
    <text x="817" y="252" text-anchor="middle" font-weight="700" fill="#3730a3">인스턴스 내부로 격리</text>

    <line x1="20" y1="268" x2="925" y2="268" stroke="#e3e4ee" stroke-width="1"/>
    <text x="20" y="290" font-weight="700" fill="#6b7280" font-size="11">지원 세대</text>
    <text x="127" y="290" text-anchor="middle">전 세대</text>
    <text x="357" y="290" text-anchor="middle">전 세대</text>
    <text x="587" y="290" text-anchor="middle">Volta+</text>
    <text x="817" y="290" text-anchor="middle" font-weight="700" fill="#3730a3">Ampere+ (A100/H100 등)</text>

    <line x1="20" y1="306" x2="925" y2="306" stroke="#e3e4ee" stroke-width="1"/>
    <text x="20" y="328" font-weight="700" fill="#6b7280" font-size="11">적합한 워크로드</text>
    <text x="127" y="328" text-anchor="middle">대형 학습·단일 서빙</text>
    <text x="357" y="328" text-anchor="middle">개발·저부하 추론</text>
    <text x="587" y="328" text-anchor="middle">다수 소형 추론</text>
    <text x="817" y="328" text-anchor="middle" font-weight="700" fill="#3730a3">멀티테넌트 프로덕션</text>
  </g>
</svg>
