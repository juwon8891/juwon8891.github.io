<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 0 980 590" role="img" aria-label="HAMi의 스케줄러와 디바이스 플러그인이 vGPU를 배치하고, 컨테이너 내부에 주입된 HAMi-core 라이브러리가 CUDA와 NVML 호출을 가로채 메모리와 컴퓨팅 코어 사용량을 소프트웨어로 제한하는 구조">
  <defs>
    <marker id="a11" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="a11s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Row1: scheduling flow -->
  <rect x="20" y="30" width="200" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="120" y="54" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">Pod spec</text>
  <text x="120" y="72" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#4338ca">nvidia.com/gpumem: 3000</text>
  <text x="120" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#4338ca">nvidia.com/gpucores: 50</text>

  <line x1="220" y1="65" x2="250" y2="65" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a11)"/>

  <rect x="250" y="30" width="200" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="350" y="58" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">Mutating Webhook</text>
  <text x="350" y="76" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">어떤 vGPU 슬롯을 쓸지</text>
  <text x="350" y="90" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">Pod annotation에 기입</text>

  <line x1="450" y1="65" x2="480" y2="65" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a11)"/>

  <rect x="480" y="30" width="220" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="590" y="54" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="700">HAMi Scheduler</text>
  <text x="590" y="72" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#4338ca">filter/score/bind로</text>
  <text x="590" y="86" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#4338ca">토폴로지 인지 배치</text>

  <line x1="700" y1="65" x2="730" y2="65" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a11)"/>

  <rect x="730" y="30" width="230" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="845" y="54" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">kubelet</text>
  <text x="845" y="72" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">HAMi Device Plugin</text>
  <text x="845" y="86" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">Allocate() 호출</text>

  <!-- 지원 벤더 note -->
  <rect x="60" y="118" width="860" height="40" rx="8" fill="#f8f8fc" stroke="#e3e4ee" stroke-width="1"/>
  <text x="490" y="142" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#6b7280">지원 벤더: NVIDIA · Cambricon · Ascend · Hygon · Iluvatar · Kunlunxin · MetaX · Moore Threads — 모두 같은 스케줄러·플러그인으로 통합 관리</text>

  <line x1="845" y1="100" x2="845" y2="176" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a11)"/>

  <!-- container boundary -->
  <rect x="60" y="184" width="860" height="318" rx="10" fill="none" stroke="#c9cee0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="80" y="204" font-family="JetBrains Mono, monospace" font-size="11" fill="#7c3aed" font-weight="700">컨테이너 내부</text>

  <rect x="350" y="216" width="280" height="60" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="490" y="238" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">애플리케이션 (vLLM/PyTorch)</text>
  <text x="490" y="255" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#6b7280">cuMemAlloc · cuLaunchKernel · nvmlDeviceGetMemoryInfo</text>
  <text x="490" y="268" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">호출</text>

  <line x1="490" y1="276" x2="490" y2="300" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#a11s)"/>

  <rect x="330" y="308" width="320" height="60" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="490" y="330" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="700">HAMi-core (libvgpu.so)</text>
  <text x="490" y="348" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">LD_PRELOAD + dlsym 후킹으로 위 호출을 가로챔</text>
  <text x="490" y="362" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">(모든 cu*/nvml* 함수 대상)</text>

  <line x1="410" y1="368" x2="270" y2="398" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#a11s)"/>
  <line x1="570" y1="368" x2="710" y2="398" stroke="#4f46e5" stroke-width="1.6" marker-end="url(#a11s)"/>

  <rect x="100" y="406" width="340" height="86" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="270" y="428" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#1e2233" font-weight="600">메모리 가드</text>
  <text x="270" y="446" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">사용량 + 요청량이 할당량 초과 시</text>
  <text x="270" y="461" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#6b7280">CUDA_ERROR_OUT_OF_MEMORY 반환</text>
  <text x="270" y="478" text-anchor="middle" font-family="Noto Sans KR" font-size="9.5" fill="#6b7280">nvmlDeviceGetMemoryInfo도 할당량만 표시</text>

  <rect x="540" y="406" width="340" height="86" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="710" y="428" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#1e2233" font-weight="600">코어 레이트리미터</text>
  <text x="710" y="446" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">g_cur_cuda_cores 소진 시 spin-wait</text>
  <text x="710" y="461" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">백그라운드 스레드가 실제 사용률을</text>
  <text x="710" y="478" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">샘플링해 카운터를 동적으로 보충</text>

  <line x1="270" y1="492" x2="270" y2="510" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="710" y1="492" x2="710" y2="510" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="270" y1="510" x2="710" y2="510" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="490" y1="510" x2="490" y2="530" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a11)"/>

  <rect x="330" y="538" width="320" height="46" rx="8" fill="#f3f4f9" stroke="#9aa0b8" stroke-width="1.6"/>
  <text x="490" y="559" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#1e2233" font-weight="600">실제 NVIDIA 드라이버 (nvidia.ko)</text>
  <text x="490" y="574" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#6b7280">→ 허용된 호출만 물리 GPU에 도달 (호스트)</text>
</svg>
