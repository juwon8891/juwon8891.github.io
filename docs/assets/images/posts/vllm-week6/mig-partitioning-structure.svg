<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-label="물리 GPU 한 장이 MIG를 통해 서로 독립된 SM, 메모리, 캐시를 가진 최대 7개의 GPU 인스턴스로 분할되고 각각이 K8s에 별도 리소스 이름으로 노출되는 구조">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="60" y="30" width="780" height="90" rx="10" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="450" y="58" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#1e2233" font-weight="700">물리 GPU 1장 (예: A100 80GB)</text>
  <text x="450" y="78" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#6b7280">108 SM · 80GB HBM · 7개 GPC(GPU Processing Cluster)</text>
  <text x="450" y="100" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#6b7280">파티션 전에는 통째로 하나의 nvidia.com/gpu 리소스</text>

  <line x1="450" y1="120" x2="450" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a5)"/>
  <text x="490" y="140" font-family="Noto Sans KR" font-size="11" fill="#6b7280">MIG 프로파일 적용</text>

  <g font-family="Noto Sans KR">
    <rect x="60" y="160" width="180" height="90" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="150" y="188" text-anchor="middle" font-size="12" fill="#1e2233" font-weight="600">Instance 1</text>
    <text x="150" y="206" text-anchor="middle" font-size="10.5" fill="#4338ca">3g.40gb</text>
    <text x="150" y="222" text-anchor="middle" font-size="10" fill="#6b7280">전용 SM+메모리+캐시</text>
    <text x="150" y="236" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#4338ca">mig-3g.40gb</text>

    <rect x="260" y="160" width="140" height="90" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="330" y="188" text-anchor="middle" font-size="12" fill="#1e2233" font-weight="600">Instance 2</text>
    <text x="330" y="206" text-anchor="middle" font-size="10.5" fill="#4338ca">2g.20gb</text>
    <text x="330" y="222" text-anchor="middle" font-size="10" fill="#6b7280">전용 SM+메모리</text>
    <text x="330" y="236" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#4338ca">mig-2g.20gb</text>

    <rect x="420" y="160" width="110" height="90" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="475" y="188" text-anchor="middle" font-size="11.5" fill="#1e2233" font-weight="600">Instance 3</text>
    <text x="475" y="206" text-anchor="middle" font-size="10" fill="#4338ca">1g.10gb</text>
    <text x="475" y="236" text-anchor="middle" font-size="9" font-family="JetBrains Mono, monospace" fill="#4338ca">mig-1g.10gb</text>

    <rect x="550" y="160" width="110" height="90" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="605" y="188" text-anchor="middle" font-size="11.5" fill="#1e2233" font-weight="600">Instance 4</text>
    <text x="605" y="206" text-anchor="middle" font-size="10" fill="#4338ca">1g.10gb</text>
    <text x="605" y="236" text-anchor="middle" font-size="9" font-family="JetBrains Mono, monospace" fill="#4338ca">mig-1g.10gb</text>

    <rect x="680" y="160" width="160" height="90" rx="8" fill="#f8f8fc" stroke="#c9cee0" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="760" y="195" text-anchor="middle" font-size="10.5" fill="#6b7280">최대 7개 인스턴스까지</text>
    <text x="760" y="211" text-anchor="middle" font-size="10.5" fill="#6b7280">GPU 모델별 지원</text>
    <text x="760" y="227" text-anchor="middle" font-size="10.5" fill="#6b7280">프로파일 상이</text>
  </g>

  <rect x="60" y="278" width="780" height="46" rx="8" fill="#fdf3e7" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="450" y="298" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#7c4a03">각 인스턴스는 kubelet에 서로 다른 리소스 이름으로 노출된다</text>
  <text x="450" y="314" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#7c4a03">→ Pod가 nvidia.com/mig-1g.10gb 처럼 원하는 크기를 정확히 지정</text>
</svg>
