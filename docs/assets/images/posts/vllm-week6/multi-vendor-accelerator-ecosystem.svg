<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="480" viewBox="0 0 940 480" role="img" aria-label="Kubernetes Device Plugin 프레임워크를 중심으로 NVIDIA, AMD, Intel, AWS, Google 다섯 벤더가 각자의 플러그인과 리소스 이름으로 연결되는 생태계 지도">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="345" y="20" width="250" height="60" rx="10" fill="#f3f4f9" stroke="#9aa0b8" stroke-width="1.8"/>
  <text x="470" y="46" text-anchor="middle" font-family="Noto Sans KR" font-size="13.5" fill="#1e2233" font-weight="700">Kubernetes</text>
  <text x="470" y="65" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#6b7280">Device Plugin Framework (표준 gRPC 인터페이스)</text>

  <!-- connectors down to 5 vendor cards -->
  <line x1="470" y1="80" x2="470" y2="105" stroke="#94a3b8" stroke-width="1.4"/>
  <line x1="90" y1="105" x2="850" y2="105" stroke="#94a3b8" stroke-width="1.4"/>

  <!-- 5 vertical drops -->
  <line x1="90" y1="105" x2="90" y2="130" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a6)"/>
  <line x1="280" y1="105" x2="280" y2="130" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a6)"/>
  <line x1="470" y1="105" x2="470" y2="130" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a6)"/>
  <line x1="660" y1="105" x2="660" y2="130" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a6)"/>
  <line x1="850" y1="105" x2="850" y2="130" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a6)"/>

  <g font-family="Noto Sans KR">
    <!-- NVIDIA -->
    <rect x="10" y="138" width="160" height="150" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
    <text x="90" y="162" text-anchor="middle" font-size="13" fill="#1e2233" font-weight="700">NVIDIA</text>
    <text x="90" y="182" text-anchor="middle" font-size="10.5" fill="#4338ca">GPU Operator</text>
    <text x="90" y="198" text-anchor="middle" font-size="10.5" fill="#4338ca">k8s-device-plugin</text>
    <text x="90" y="222" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#4338ca">nvidia.com/gpu</text>
    <text x="90" y="238" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#4338ca">nvidia.com/mig-*</text>
    <text x="90" y="262" text-anchor="middle" font-size="9.5" fill="#6b7280">A100 · H100 · L40S</text>

    <!-- AMD -->
    <rect x="200" y="138" width="160" height="150" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="280" y="162" text-anchor="middle" font-size="13" fill="#1e2233" font-weight="700">AMD</text>
    <text x="280" y="182" text-anchor="middle" font-size="10.5" fill="#3b3f52">ROCm device plugin</text>
    <text x="280" y="198" text-anchor="middle" font-size="10.5" fill="#3b3f52">AMD GPU Operator</text>
    <text x="280" y="222" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#3b3f52">amd.com/gpu</text>
    <text x="280" y="248" text-anchor="middle" font-size="9.5" fill="#6b7280">Instinct MI300X 등</text>

    <!-- Intel -->
    <rect x="390" y="138" width="160" height="150" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="470" y="162" text-anchor="middle" font-size="13" fill="#1e2233" font-weight="700">Intel</text>
    <text x="470" y="182" text-anchor="middle" font-size="10.5" fill="#3b3f52">Device Plugins Operator</text>
    <text x="470" y="198" text-anchor="middle" font-size="10.5" fill="#3b3f52">(GPU/Gaudi/QAT/FPGA)</text>
    <text x="470" y="222" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#3b3f52">gpu.intel.com/i915</text>
    <text x="470" y="238" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#3b3f52">habana.ai/gaudi</text>
    <text x="470" y="262" text-anchor="middle" font-size="9.5" fill="#6b7280">Flex/Max GPU · Gaudi</text>

    <!-- AWS -->
    <rect x="580" y="138" width="160" height="150" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="660" y="162" text-anchor="middle" font-size="13" fill="#1e2233" font-weight="700">AWS (EKS)</text>
    <text x="660" y="182" text-anchor="middle" font-size="10.5" fill="#3b3f52">Neuron device plugin</text>
    <text x="660" y="222" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#3b3f52">aws.amazon.com/neuron</text>
    <text x="660" y="248" text-anchor="middle" font-size="9.5" fill="#6b7280">Trainium · Inferentia</text>

    <!-- Google -->
    <rect x="770" y="138" width="160" height="150" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="850" y="162" text-anchor="middle" font-size="13" fill="#1e2233" font-weight="700">Google (GKE)</text>
    <text x="850" y="182" text-anchor="middle" font-size="10.5" fill="#3b3f52">GKE 노드/스케줄러</text>
    <text x="850" y="198" text-anchor="middle" font-size="10.5" fill="#3b3f52">통합 (전용 플러그인 아님)</text>
    <text x="850" y="222" text-anchor="middle" font-size="9.5" font-family="JetBrains Mono, monospace" fill="#3b3f52">google.com/tpu</text>
    <text x="850" y="248" text-anchor="middle" font-size="9.5" fill="#6b7280">TPU v5e/v6e (Trillium)</text>
  </g>

  <rect x="60" y="320" width="820" height="130" rx="8" fill="#f8f8fc" stroke="#e3e4ee" stroke-width="1"/>
  <text x="80" y="346" font-family="Noto Sans KR" font-size="11.5" fill="#1e2233" font-weight="700">공통점</text>
  <text x="80" y="366" font-family="Noto Sans KR" font-size="11" fill="#6b7280">모두 같은 Device Plugin gRPC 인터페이스(Register / ListAndWatch / Allocate)를 구현한다.</text>
  <text x="80" y="384" font-family="Noto Sans KR" font-size="11" fill="#6b7280">Pod 입장에서는 벤더 구분 없이 resources.limits에 리소스 이름만 적으면 된다.</text>
  <text x="80" y="410" font-family="Noto Sans KR" font-size="11.5" fill="#1e2233" font-weight="700">차이점</text>
  <text x="80" y="430" font-family="Noto Sans KR" font-size="11" fill="#6b7280">공유 방식(MIG·파티션 유무), 오퍼레이터 유무, 관리형 클라우드 통합 수준은 벤더마다 다르다.</text>
</svg>
