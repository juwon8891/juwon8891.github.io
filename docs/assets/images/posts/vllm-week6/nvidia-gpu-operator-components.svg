<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420" role="img" aria-label="ClusterPolicy CRD 하나로 NVIDIA GPU Operator가 드라이버, 컨테이너 툴킷, 디바이스 플러그인, DCGM 익스포터, GPU Feature Discovery, MIG 매니저를 각 GPU 노드에 데몬셋으로 배포하는 구조">
  <defs>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="370" y="20" width="200" height="56" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="470" y="44" text-anchor="middle" font-family="Noto Sans KR" font-size="13" fill="#1e2233" font-weight="700">GPU Operator</text>
  <text x="470" y="62" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#4338ca">CR: ClusterPolicy</text>

  <line x1="470" y1="76" x2="470" y2="105" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="110" y1="105" x2="840" y2="105" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- 5 daemonset boxes: centers at 110 / 295 / 470 / 655 / 840, each 170 wide -->
  <g font-family="Noto Sans KR">
    <line x1="110" y1="105" x2="110" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>
    <rect x="25" y="130" width="170" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="110" y="155" text-anchor="middle" font-size="12.5" fill="#1e2233" font-weight="500">NVIDIA Driver</text>
    <text x="110" y="172" text-anchor="middle" font-size="10.5" fill="#6b7280">노드 커널에 GPU 드라이버</text>
    <text x="110" y="186" text-anchor="middle" font-size="10.5" fill="#6b7280">컨테이너로 설치</text>

    <line x1="295" y1="105" x2="295" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>
    <rect x="210" y="130" width="170" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="295" y="155" text-anchor="middle" font-size="12.5" fill="#1e2233" font-weight="500">Container Toolkit</text>
    <text x="295" y="172" text-anchor="middle" font-size="10.5" fill="#6b7280">containerd/CRI-O에</text>
    <text x="295" y="186" text-anchor="middle" font-size="10.5" fill="#6b7280">런타임 훅(hook) 연결</text>

    <line x1="470" y1="105" x2="470" y2="130" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#a3)"/>
    <rect x="385" y="130" width="170" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="470" y="155" text-anchor="middle" font-size="12.5" fill="#1e2233" font-weight="700">Device Plugin</text>
    <text x="470" y="172" text-anchor="middle" font-size="10.5" fill="#4338ca">K8s Device Plugin API</text>
    <text x="470" y="186" text-anchor="middle" font-size="10.5" fill="#4338ca">구현체 (Fig.01/02)</text>

    <line x1="655" y1="105" x2="655" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>
    <rect x="570" y="130" width="170" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="655" y="155" text-anchor="middle" font-size="12.5" fill="#1e2233" font-weight="500">DCGM Exporter</text>
    <text x="655" y="172" text-anchor="middle" font-size="10.5" fill="#6b7280">Prometheus용 GPU</text>
    <text x="655" y="186" text-anchor="middle" font-size="10.5" fill="#6b7280">사용률·온도·ECC 메트릭</text>

    <line x1="840" y1="105" x2="840" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>
    <rect x="755" y="130" width="170" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
    <text x="840" y="155" text-anchor="middle" font-size="12.5" fill="#1e2233" font-weight="500">GPU Feature Discovery</text>
    <text x="840" y="172" text-anchor="middle" font-size="10.5" fill="#6b7280">노드에 GPU 모델·</text>
    <text x="840" y="186" text-anchor="middle" font-size="10.5" fill="#6b7280">드라이버 버전 라벨링</text>
  </g>

  <rect x="330" y="240" width="280" height="70" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="470" y="265" text-anchor="middle" font-family="Noto Sans KR" font-size="12.5" fill="#1e2233" font-weight="500">MIG Manager</text>
  <text x="470" y="282" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">ClusterPolicy에 선언된 MIG 프로파일대로</text>
  <text x="470" y="296" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">A100/H100을 자동 분할 (Fig.05)</text>
  <line x1="470" y1="200" x2="470" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a3)"/>

  <rect x="140" y="335" width="660" height="55" rx="8" fill="#fdf3e7" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="470" y="357" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#7c4a03">선행 조건: Node Feature Discovery(NFD)</text>
  <text x="470" y="374" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#7c4a03">NFD가 GPU 하드웨어를 먼저 감지해야 Operator가 대상 노드를 인식</text>
</svg>
