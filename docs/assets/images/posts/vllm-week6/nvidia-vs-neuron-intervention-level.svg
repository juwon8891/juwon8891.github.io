<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-label="NVIDIA는 Device Plugin의 Allocate 이후 컨테이너 런타임 레벨까지 개입해 호스트 드라이버 라이브러리를 마운트하지만, AWS Neuron은 Device Plugin이 환경 변수만 반환하고 컨테이너 런타임 개입 없이 끝나는 차이를 보여준다">
  <defs>
    <marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="250" y="18" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#1e2233" font-weight="700">NVIDIA</text>
  <text x="730" y="18" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#1e2233" font-weight="700">AWS Neuron</text>
  <line x1="500" y1="10" x2="500" y2="340" stroke="#e3e4ee" stroke-width="1.4"/>

  <!-- Row1: Pod spec -->
  <rect x="60" y="30" width="380" height="54" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="250" y="52" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">Pod spec</text>
  <text x="250" y="70" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#4338ca">nvidia.com/gpu: 1</text>

  <rect x="540" y="30" width="380" height="54" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="730" y="52" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">Pod spec</text>
  <text x="730" y="70" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#4338ca">aws.amazon.com/neuron: 1</text>

  <line x1="250" y1="84" x2="250" y2="104" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a12)"/>
  <line x1="730" y1="84" x2="730" y2="104" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a12)"/>

  <!-- Row2: Device Plugin Allocate -->
  <rect x="60" y="104" width="380" height="64" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="250" y="126" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">Device Plugin Allocate()</text>
  <text x="250" y="144" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">디바이스 경로 + env 응답</text>
  <text x="250" y="158" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#6b7280">/dev/nvidia0, NVIDIA_VISIBLE_DEVICES</text>

  <rect x="540" y="104" width="380" height="64" rx="8" fill="#f3f4f9" stroke="#c9cee0" stroke-width="1.5"/>
  <text x="730" y="126" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">Device Plugin Allocate()</text>
  <text x="730" y="144" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#6b7280">환경 변수만 응답</text>
  <text x="730" y="158" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#6b7280">NEURON_RT_VISIBLE_CORES=0</text>

  <line x1="250" y1="168" x2="250" y2="188" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a12)"/>
  <line x1="730" y1="168" x2="730" y2="188" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- Row3: extra intervention (NVIDIA) vs absent (Neuron) -->
  <rect x="60" y="188" width="380" height="76" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="250" y="212" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="700">Container Toolkit 개입</text>
  <text x="250" y="230" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#4338ca">OCI 훅/CDI로 호스트의</text>
  <text x="250" y="245" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#4338ca">libcuda.so 등을 컨테이너에</text>
  <text x="250" y="258" text-anchor="middle" font-family="Noto Sans KR" font-size="10" fill="#4338ca">복사·마운트</text>

  <rect x="540" y="188" width="380" height="76" rx="8" fill="#f8f8fc" stroke="#c9cee0" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="730" y="216" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#9199b0" font-weight="600">런타임 개입 없음</text>
  <text x="730" y="234" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#9199b0">Neuron SDK 유저스페이스 라이브러리가</text>
  <text x="730" y="250" text-anchor="middle" font-family="Noto Sans KR" font-size="10.5" fill="#9199b0">pip로 이미 컨테이너 이미지 안에 있음</text>

  <line x1="250" y1="264" x2="250" y2="284" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a12)"/>
  <line x1="730" y1="264" x2="730" y2="284" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#a12)"/>

  <!-- Row4: ready -->
  <rect x="60" y="284" width="380" height="50" rx="8" fill="#f3f4f9" stroke="#9aa0b8" stroke-width="1.6"/>
  <text x="250" y="314" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">컨테이너 시작 → GPU 사용 가능</text>

  <rect x="540" y="284" width="380" height="50" rx="8" fill="#f3f4f9" stroke="#9aa0b8" stroke-width="1.6"/>
  <text x="730" y="314" text-anchor="middle" font-family="Noto Sans KR" font-size="12" fill="#1e2233" font-weight="600">컨테이너 시작 → NeuronCore 사용 가능</text>

  <rect x="60" y="352" width="860" height="60" rx="8" fill="#fdf3e7" stroke="#b45309" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="490" y="376" text-anchor="middle" font-family="Noto Sans KR" font-size="11.5" fill="#7c4a03" font-weight="600">Neuron은 여기에 Neuron Scheduler Extension을 하나 더 얹는다</text>
  <text x="490" y="396" text-anchor="middle" font-family="Noto Sans KR" font-size="11" fill="#7c4a03">기본 kube-scheduler 대신 어떤 칩의 어떤 NeuronCore가 비어 있는지까지 배치 시점에 고려하는 커스텀 스케줄러(my-scheduler)</text>
</svg>
